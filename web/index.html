<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#dfe4ea" />
    <link rel="stylesheet" href="./src/style.css" />
    <title>Elizabeth · 网页原型</title>
  </head>
  <body>
    <div id="app"></div>

    <header id="hud">
      <div class="title">
        <h1>ELIZABETH</h1>
        <span class="ver">web prototype · v0.1</span>
      </div>
      <ul class="keys">
        <li><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd><em>移动</em></li>
        <li><kbd>Shift</kbd><em>冲刺</em></li>
        <li><kbd>拖拽</kbd><em>转视角</em></li>
        <li><kbd>滚轮</kbd><em>缩放</em></li>
        <li><kbd>R</kbd><em>回到原点</em></li>
        <li><kbd>T</kbd><em>收起/举牌</em></li>
      </ul>
    </header>

    <footer id="stats">
      <span id="fps"></span>
      <span id="state" data-state="idle">idle</span>
      <span class="note">布料 = 8 个烘焙形态键，未与腿/脚做碰撞（<code>docs/KNOWN_ISSUES.md</code>）</span>
    </footer>

    <div id="loading">
      <div class="load-box">
        <div class="bar"><i id="bar"></i></div>
        <p><b id="pct">0%</b><span>正在加载伊丽莎白…</span></p>
      </div>
    </div>

    <div id="error" hidden>
      <div class="err-box">
        <h2>加载失败</h2>
        <pre id="err-msg"></pre>
      </div>
    </div>

    <!-- 零构建：three 用本地 vendor，裸模块名交给 importmap 解析 -->
    <script type="importmap">
      {
        "imports": {
          "three": "./vendor/three.module.js",
          "three/addons/": "./vendor/addons/"
        }
      }
    </script>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
